name: Midway
options:
  bundleIdPrefix: com.midway
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  SnapSDK:
    url: https://github.com/Snapchat/snap-kit-spm
    from: "2.5.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Midway:
    type: application
    platform: iOS
    sources:
      - Midway
    dependencies:
      - package: SnapSDK
        product: SnapSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.midway.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    entitlements:
      path: Midway/Support/Midway.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:midway.app
        aps-environment: development
    info:
      path: Midway/Support/Info.plist
      properties:
        CFBundleDisplayName: Midway
        UILaunchScreen: {}
        # Base URL of the Midway server (Server/ in this repo). Leave empty
        # to run fully on-device with the demo backend.
        MIDWAY_API_URL: ""
        NSLocationWhenInUseUsageDescription: >-
          Midway uses your location only while planning a meetup, to estimate
          travel times and find fair places to meet. You choose exact,
          approximate, or manual sharing for every plan.
        NSCalendarsWriteOnlyAccessUsageDescription: >-
          Midway can add a confirmed meetup to your calendar so you don't
          forget the plan.
        LSApplicationQueriesSchemes:
          - snapchat
        CFBundleURLTypes:
          - CFBundleURLName: com.midway.app
            CFBundleURLSchemes:
              - midway
        # --- Snap Kit configuration (replace with your Snap Kit app values) ---
        SCSDKClientId: YOUR_SNAP_KIT_CLIENT_ID
        SCSDKRedirectUrl: midway://snap-kit/oauth2
        SCSDKScopes:
          - https://auth.snapchat.com/oauth2/api/user.display_name
          - https://auth.snapchat.com/oauth2/api/user.bitmoji.avatar
          - https://auth.snapchat.com/oauth2/api/user.external_id

  MidwayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MidwayTests
    dependencies:
      - target: Midway

  MidwayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MidwayUITests
    dependencies:
      - target: Midway

schemes:
  Midway:
    build:
      targets:
        Midway: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MidwayTests
        - MidwayUITests
