name: UI Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Build, test, and capture UI screenshots
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer the latest Xcode 26.x on the image; keep the default otherwise.
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          NAME=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone 1[6-9][a-zA-Z ]*' | head -1 | sed 's/ *$//')
          echo "name=${NAME:-iPhone 17}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${NAME:-iPhone 17}"
          # Boot now so first-boot system banners (e.g. "Ready for Apple
          # Intelligence") appear and clear while the build runs, instead
          # of photobombing the first screenshot.
          xcrun simctl boot "${NAME:-iPhone 17}" || true
          xcrun simctl bootstatus "${NAME:-iPhone 17}" -b || true

      - name: Build and run tests (unit + UI screenshots)
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          set -o pipefail
          mkdir -p screenshots
          xcodebuild test \
            -project Midway.xcodeproj \
            -scheme Midway \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Record the opening logo animation
        run: |
          APP_PATH=$(find DerivedData/Build/Products -maxdepth 2 -name "Midway.app" -type d | head -1)
          echo "Recording launch of $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl terminate booted com.midway.app 2>/dev/null || true
          xcrun simctl io booted recordVideo --codec h264 --force logo-animation.mp4 &
          RECORDER=$!
          sleep 2
          xcrun simctl launch booted com.midway.app -uiTestMode
          sleep 11
          kill -INT "$RECORDER"
          wait "$RECORDER" || true
          ls -la logo-animation.mp4

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midway-ui-screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Upload logs and result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log

      - name: Commit screenshots and video to the branch
        # Temporarily always(): committing diagnostic captures while
        # debugging the invite-respond failure. Restore to success() after.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/screenshots docs/media
          cp screenshots/*.png docs/screenshots/ 2>/dev/null || true
          cp logo-animation.mp4 docs/media/ 2>/dev/null || true
          git add docs/screenshots docs/media
          git commit -m "Add simulator UI screenshots and logo video [skip ci]" || echo "No changes"
          git push
